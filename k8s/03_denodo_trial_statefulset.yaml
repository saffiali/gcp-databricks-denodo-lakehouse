# =============================================================================
# 03. Denodo 8.0 Trial Server on GKE — StatefulSet with InitContainers & PVC
#     Deploys Virtual DataPort (:9999/:9996), Design Studio (:9090/denodo-design-studio),
#     and Data Catalog (:9090/denodo-data-catalog) on n4-standard-8 GKE nodes.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: denodo-vdp-trial
  namespace: denodo-trial
  labels:
    app.kubernetes.io/name: denodo-vdp-trial
    app.kubernetes.io/component: vdp-server
    app.kubernetes.io/version: "8.0-trial"
spec:
  serviceName: denodo-vdp-headless
  replicas: 1 # Single-pod 30-day Trial Server license compliance (scalable to 2+ with enterprise license)
  selector:
    matchLabels:
      app.kubernetes.io/name: denodo-vdp-trial
  template:
    metadata:
      labels:
        app.kubernetes.io/name: denodo-vdp-trial
        app.kubernetes.io/component: vdp-server
    spec:
      serviceAccountName: denodo-vdp-ksa
      nodeSelector:
        workload: denodo-vdp-trial
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: denodo-registry-secret

      # -----------------------------------------------------------------------
      # InitContainers:
      # 1. Stage Simba Spark JDBC (Databricks) & Simba BigQuery JDBC (StorageReadAPI)
      # 2. Inject 30-Day Denodo Trial License & VDBConfiguration.properties
      # -----------------------------------------------------------------------
      initContainers:
        - name: install-simba-jdbc-drivers
          image: google/cloud-sdk:slim
          command: ["/bin/bash", "/config/install-jdbc-drivers.sh"]
          volumeMounts:
            - name: denodo-config-vol
              mountPath: /config
            - name: denodo-jdbc-drivers
              mountPath: /denodo-drivers

        - name: configure-trial-license
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /denodo-conf
              cp /license-secret/denodo.lic /denodo-conf/denodo.lic
              cp /config/VDBConfiguration.properties /denodo-conf/VDBConfiguration.properties
              chmod 0640 /denodo-conf/denodo.lic /denodo-conf/VDBConfiguration.properties
              echo "[InitContainer] Denodo 8.0 Trial License & VDBConfiguration staged."
          volumeMounts:
            - name: denodo-license-vol
              mountPath: /license-secret
              readOnly: true
            - name: denodo-config-vol
              mountPath: /config
              readOnly: true
            - name: denodo-runtime-conf
              mountPath: /denodo-conf

      # -----------------------------------------------------------------------
      # Main Container: Denodo Platform 8.0 Trial Server (VDP + Design Studio + Data Catalog)
      # Image mirrored from harbor.open.denodo.com/denodo-8.0/images/denodo-platform:8.0
      # into Private GCP Artifact Registry over restricted.googleapis.com
      # -----------------------------------------------------------------------
      containers:
        - name: denodo-vdp-server
          image: europe-west2-docker.pkg.dev/gke-demos-363017/rd-lakehouse-denodo-trial/denodo-platform:8.0-trial
          imagePullPolicy: IfNotPresent
          args:
            - "--vdpserver"
            - "--designstudio"
            - "--datacatalog"
          env:
            - name: DENODO_LICENSE_FILE
              value: "/opt/denodo/conf/denodo.lic"
            - name: DENODO_JVM_OPTS
              value: "-Xms8g -Xmx16g -XX:+UseG1GC -Dcom.denodo.security.ssl.enabled=true"
            - name: DATABRICKS_JDBC_URL
              value: "jdbc:spark://8259555750233451.1.gcp.databricks.com:443/default;transportMode=http;ssl=1;httpPath=sql/protocolv1/o/8259555750233451/0154a901254a4f17;AuthMech=3;UID=token"
            - name: BIGQUERY_CACHE_PROJECT
              value: "gke-demos-363017"
            - name: BIGQUERY_CACHE_DATASET
              value: "denodo_vdp_cache"
            - name: ENABLE_STORAGE_READ_API
              value: "1"
            - name: DENODO_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: denodo-admin-credentials
                  key: DENODO_ADMIN_USER
            - name: DENODO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: denodo-admin-credentials
                  key: DENODO_ADMIN_PASSWORD
          ports:
            - name: vdp-jdbc
              containerPort: 9999
              protocol: TCP
            - name: vdp-odbc
              containerPort: 9996
              protocol: TCP
            - name: vdp-jmx
              containerPort: 9997
              protocol: TCP
            - name: web-http
              containerPort: 9090
              protocol: TCP
            - name: web-https
              containerPort: 9443
              protocol: TCP
          resources:
            requests:
              cpu: "4000m"
              memory: "16Gi"
            limits:
              cpu: "7000m"
              memory: "28Gi"
          startupProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: denodo-metadata-pvc
              mountPath: /opt/denodo/metadata
            - name: denodo-jdbc-drivers
              mountPath: /opt/denodo/extensions/thirdparty/lib
            - name: denodo-runtime-conf
              mountPath: /opt/denodo/conf

      volumes:
        - name: denodo-license-vol
          secret:
            secretName: denodo-trial-license-secret
        - name: denodo-config-vol
          configMap:
            name: denodo-vdp-server-config
            defaultMode: 0755
        - name: denodo-jdbc-drivers
          emptyDir: {}
        - name: denodo-runtime-conf
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: denodo-metadata-pvc
        labels:
          app.kubernetes.io/name: denodo-vdp-trial
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: denodo-hyperdisk-cmek
        resources:
          requests:
            storage: 100Gi
