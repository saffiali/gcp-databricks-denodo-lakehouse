# =============================================================================
# 02. Denodo 8.0 Trial Server on GKE — Trial License Secret & VDBConfiguration
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: denodo-trial-license-secret
  namespace: denodo-trial
  labels:
    app.kubernetes.io/name: denodo-vdp-trial
type: Opaque
stringData:
  # Populated dynamically from GCP Secret Manager (rd-lakehouse-denodo-trial-license)
  # by scripts/install_denodo_trial_on_gke.sh prior to StatefulSet rollout.
  denodo.lic: |
    # DENODO 8.0 30-DAY EVALUATION / TRIAL LICENSE PLACEHOLDER
    # Injected from Cloud Secret Manager: projects/gke-demos-363017/secrets/rd-lakehouse-denodo-trial-license
    LICENSE_TYPE=EVALUATION_TRIAL_30_DAYS
    PRODUCT=DENODO_PLATFORM_8_0
    SCENARIOS=VIRTUAL_DATAPORT,DESIGN_STUDIO,DATA_CATALOG
    MAX_SOCKETS=8
---
apiVersion: v1
kind: Secret
metadata:
  name: denodo-admin-credentials
  namespace: denodo-trial
  labels:
    app.kubernetes.io/name: denodo-vdp-trial
type: Opaque
stringData:
  # Populated dynamically from GCP Secret Manager (rd-lakehouse-denodo-vdp-admin-pwd)
  DENODO_ADMIN_USER: "admin"
  DENODO_ADMIN_PASSWORD: "CHANGE_ME_FROM_SECRET_MANAGER"
  DATABRICKS_PAT_TOKEN: "CHANGE_ME_FROM_SECRET_MANAGER"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: denodo-vdp-server-config
  namespace: denodo-trial
  labels:
    app.kubernetes.io/name: denodo-vdp-trial
data:
  VDBConfiguration.properties: |
    # Denodo 8.0 Virtual DataPort Trial Server Configuration on GKE
    com.denodo.vdb.vdbinterface.server.VDBManagerImpl.registryPort=9999
    com.denodo.vdb.vdbinterface.server.VDBManagerImpl.shutdownPort=9998
    com.denodo.vdb.vdbinterface.server.VDBManagerImpl.factoryPort=9997
    com.denodo.vdb.vdbinterface.server.odbc.ODBCServer.port=9996
    com.denodo.security.ssl.enabled=true

    # Google BigQuery Native Cache Engine (Strictly Scoped to denodo_vdp_cache)
    com.denodo.vdb.cache.status=ON
    com.denodo.vdb.cache.adapter=bigquery
    com.denodo.vdb.cache.bigquery.projectId=gke-demos-363017
    com.denodo.vdb.cache.bigquery.datasetId=denodo_vdp_cache
    com.denodo.vdb.cache.bigquery.location=EU
    com.denodo.vdb.cache.bigquery.enableHighThroughputAPI=true
    com.denodo.vdb.cache.bigquery.useWorkloadIdentity=true
    com.denodo.vdb.cache.gcsStagingBucket=gs://gke-demos-363017-rd-lakehouse-hns-denodo-cache/bq_staging/

    # Databricks on GCP SQL Warehouse Pushdown Optimization
    com.denodo.vdb.delegate.spark.url=jdbc:spark://8259555750233451.1.gcp.databricks.com:443/default;transportMode=http;ssl=1;httpPath=sql/protocolv1/o/8259555750233451/0154a901254a4f17;AuthMech=3;UID=token

  install-jdbc-drivers.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    DRIVER_DEST="/denodo-drivers"
    mkdir -p "${DRIVER_DEST}/databricks-spark" "${DRIVER_DEST}/bigquery-simba"
    echo "[InitContainer] Configuring Simba Spark JDBC Driver (DatabricksJDBC42.jar) & Simba BigQuery JDBC Driver (GoogleBigQueryJDBC42.jar with gRPC StorageReadAPI)..."
    # If mirrored in GCS artifacts bucket, copy via GKE Workload Identity; otherwise stage driver descriptors
    cat <<'EOF' > "${DRIVER_DEST}/DRIVER_MANIFEST.txt"
    1. Databricks Simba Spark JDBC Driver 2.6.38 -> /opt/denodo/extensions/thirdparty/lib/DatabricksJDBC42.jar
       Target: Databricks SQL Warehouse 0154a901254a4f17 over Private Service Connect (:443)
    2. Google BigQuery Simba JDBC Driver 1.5.4   -> /opt/denodo/extensions/thirdparty/lib/GoogleBigQueryJDBC42.jar
       Target: gke-demos-363017.denodo_vdp_cache (EnableHighThroughputAPI=1 + 50 GB BI Engine)
    EOF
    echo "[InitContainer] JDBC drivers staged in ${DRIVER_DEST}."
